name: Build Test

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use GitHub build targets
        shell: bash
        run: |
          cp -f \
            "${GITHUB_WORKSPACE}/BedrockLauncher/GitHub.Directory.Build.targets" \
            "${GITHUB_WORKSPACE}/BedrockLauncher/Directory.Build.targets"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Windows Desktop runtime required by PostSharp
        shell: pwsh
        run: |
          $desktopRuntimeVersion = "10.0.15"
          $desktopRuntimePath = Join-Path $env:DOTNET_ROOT "shared/Microsoft.WindowsDesktop.App/$desktopRuntimeVersion"
          if (-not (Test-Path $desktopRuntimePath)) {
            $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
            Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer
            & $installer -Runtime windowsdesktop -Version $desktopRuntimeVersion -InstallDir $env:DOTNET_ROOT -NoPath
          }
          if (-not (Test-Path $desktopRuntimePath)) {
            throw "Microsoft.WindowsDesktop.App $desktopRuntimeVersion was not installed; PostSharp cannot build without it."
          }
          dotnet --list-runtimes

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore BedrockLauncher.sln

      - name: Build
        run: msbuild BedrockLauncher.sln /p:Configuration=Debug /p:Restore=false

      - name: Test
        run: dotnet test tests/BedrockLauncher.Pipeline.Tests/BedrockLauncher.Pipeline.Tests.csproj --configuration Debug --no-restore